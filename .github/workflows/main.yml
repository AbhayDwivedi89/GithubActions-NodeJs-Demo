name: Build NodeJS Application  
on: push
jobs:
  job_build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout the code on runner VM
        uses: actions/checkout@v7
      - name: Install NodeJs
        uses: actions/setup-node@v7
        with:
          node-version: '18'
      - name: Install NodeJS dependencies
        run: npm ci
      - name: Execute the test case
        run: npm test
      - name: Build the application
        run: npm run build
